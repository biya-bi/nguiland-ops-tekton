apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: helm-chart-oci-publish
  namespace: cicd
spec:
  description: >-
    Checkout a Helm chart repository and publish Helm chart packages
    to the configured OCI registry.
  params:
    - name: namespace
      type: string
      default: ""
    - name: repository
      type: string
      default: ""
    - name: repo-url
      type: string
      default: ""
    - name: repo-revision
      type: string
      default: ""
    - name: charts-dir
      default: addons
    - name: registry-host
      default: artifactory-jcr.${ENVIRONMENT}.svc.cluster.local:8082
    - name: registry-repo
      default: docker-local
    - name: registry-subpath
      default: ""
      description: Optional path below the registry repository for publishing charts.
    - name: artifactory-readiness-timeout
      default: 10m
    - name: skip-tls
      type: string
      default: ${SKIP_TLS}
    - name: excluded-charts
      type: string
      default: ""
      description: >-
        Space-separated list of chart names to exclude (based on 'name' field in Chart.yaml).
  workspaces:
    - name: helm-source
    - name: manifest-dir
    - name: docker-config
    - name: ssh-directory
  tasks:
    - name: normalize-registry-host
      taskRef:
        name: normalize-absolute-path
      params:
        - name: path
          value: $(params.registry-host)
    - name: normalize-registry-repo
      taskRef:
        name: normalize-relative-path
      params:
        - name: path
          value: $(params.registry-repo)
    - name: normalize-registry-subpath
      taskRef:
        name: normalize-relative-path
      params:
        - name: path
          value: $(params.registry-subpath)
    - name: validate-flux
      taskRef:
        name: git-flux-validation
      params:
        - name: url
          value: $(params.repo-url)
        - name: flux-gitrepo-namespace
          value: $(params.namespace)
        - name: flux-gitrepo-name
          value: $(params.repository)
    - name: get-helm-gitrepo
      runAfter:
        - validate-flux
      taskRef:
        name: flux-git-repo
      params:
        - name: repository
          value: $(params.repository)
        - name: namespace
          value: $(params.namespace)
      workspaces:
        - name: manifest-dir
          workspace: manifest-dir
    - name: parse-helm-gitrepo
      runAfter:
        - get-helm-gitrepo
      taskRef:
        name: git-flux-parsing
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.repo-revision)
        - name: manifest-file
          value: $(tasks.get-helm-gitrepo.results.manifest-file)
      workspaces:
        - name: manifest-dir
          workspace: manifest-dir
    - name: fetch-helm-source
      runAfter:
        - parse-helm-gitrepo
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd/catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/git-clone/0.9/git-clone.yaml
      params:
        - name: url
          value: $(tasks.parse-helm-gitrepo.results.url)
        - name: revision
          value: $(tasks.parse-helm-gitrepo.results.revision)
      workspaces:
        - name: output
          workspace: helm-source
        - name: ssh-directory
          workspace: ssh-directory
    - name: wait-for-deployment-ready
      runAfter:
        - fetch-helm-source
      taskRef:
        name: wait-for-deployment-ready
      params:
        - name: namespace
          value: ${ENVIRONMENT}
        - name: selector
          value: app.kubernetes.io/instance=artifactory-jcr
        - name: timeout
          value: $(params.artifactory-readiness-timeout)
    - name: publish-helm-charts
      runAfter:
        - wait-for-deployment-ready
        - normalize-registry-host
        - normalize-registry-repo
        - normalize-registry-subpath
      taskRef:
        name: helm-chart-oci-publish
      params:
        - name: charts-dir
          value: $(params.charts-dir)
        - name: registry
          value: oci://$(tasks.normalize-registry-host.results.path)/$(tasks.normalize-registry-repo.results.path)
        - name: repo-path
          value: $(tasks.normalize-registry-subpath.results.path)
        - name: skip-tls
          value: $(params.skip-tls)
        - name: excluded-charts
          value: $(params.excluded-charts)
      workspaces:
        - name: source
          workspace: helm-source
        - name: docker-config
          workspace: docker-config
