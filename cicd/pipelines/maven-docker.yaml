apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: maven-docker
  namespace: cicd
spec:
  description: |
    This pipeline does the following:
      - Checks out a Git repository containing a Maven project.
      - Builds the Maven project.
      - Builds a Docker image from the Maven project.
      - Pushes the built Docker image to an image registry.
  params:
    - name: repo-url
      type: string
      default: ""
    - name: repo-revision
      type: string
      default: ""
    - name: flux-gitrepo-namespace
      type: string
      default: ""
      description: The namespace containing the Flux Git repository representing the Maven project.
    - name: flux-gitrepo-name
      type: string
      default: ""
      description: The name of the Flux Git repository representing the Maven project.
    - name: context-dir
      type: string
      default: .
      description: The directory from which to launch the Maven build.
    - name: image-push-endpoint
      type: string
      default: artifactory-jcr.${ENVIRONMENT}.svc.cluster.local:8082
    - name: image-registry-repo
      type: string
      default: docker-local
    - name: maven-image
      type: string
      default: gcr.io/cloud-builders/mvn:3.9.1
  workspaces:
    - name: source
    - name: maven-settings
    - name: maven-local-repo
    - name: flux-manifests
    - name: docker-config
    - name: ssh-directory
  results:
    - name: image-url
      description: The registry URL and tag of the pushed image.
      value: $(tasks.build-docker-image.results.IMAGE_URL)
    - name: image-digest
      description: The digest of the pushed image.
      value: $(tasks.build-docker-image.results.IMAGE_DIGEST)
    - name: image-ref
      description: The immutable registry reference of the pushed image.
      value: $(tasks.build-docker-image.results.IMAGE_URL)@$(tasks.build-docker-image.results.IMAGE_DIGEST)
  tasks:
    - name: validate-flux
      taskRef:
        name: git-flux-validation
      params:
        - name: url
          value: $(params.repo-url)
        - name: flux-gitrepo-namespace
          value: $(params.flux-gitrepo-namespace)
        - name: flux-gitrepo-name
          value: $(params.flux-gitrepo-name)
    - name: get-flux-gitrepo
      runAfter:
        - validate-flux
      taskRef:
        name: flux-git-repo
      params:
        - name: repository
          value: $(params.flux-gitrepo-name)
        - name: namespace
          value: $(params.flux-gitrepo-namespace)
      workspaces:
        - name: manifest-dir
          workspace: flux-manifests
    - name: parse-flux
      runAfter:
        - get-flux-gitrepo
      taskRef:
        name: git-flux-parsing
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.repo-revision)
        - name: manifest-file
          value: $(tasks.get-flux-gitrepo.results.manifest-file)
      workspaces:
        - name: manifest-dir
          workspace: flux-manifests
    - name: fetch-source
      runAfter:
        - parse-flux
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd/catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/git-clone/0.9/git-clone.yaml
      params:
        - name: url
          value: $(tasks.parse-flux.results.url)
        - name: revision
          value: $(tasks.parse-flux.results.revision)
      workspaces:
        - name: output
          workspace: source
        - name: ssh-directory
          workspace: ssh-directory
    - name: get-artifact-details
      runAfter:
        - fetch-source
      taskRef:
        name: maven-artifact-details
      params:
        - name: context-dir
          value: $(params.context-dir)
      workspaces:
        - name: source
          workspace: source
    - name: build-source
      runAfter:
        - fetch-source
      taskRef:
        kind: Task
        name: mvn
      params:
        - name: maven-image
          value: $(params.maven-image)
        - name: goals
          value:
            - -pl
            - $(params.context-dir)
            - -B
            - -U
            - package
      workspaces:
        - name: maven-settings
          workspace: maven-settings
        - name: source
          workspace: source
        - name: maven-local-repo
          workspace: maven-local-repo
    - name: build-docker-image
      runAfter:
        - build-source
        - get-artifact-details
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd/catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/kaniko/0.6/kaniko.yaml
      params:
        - name: CONTEXT
          value: $(params.context-dir)
        - name: IMAGE
          value: $(params.image-push-endpoint)/$(params.image-registry-repo)/$(tasks.get-artifact-details.results.group-id)/$(tasks.get-artifact-details.results.artifact-id):$(tasks.get-artifact-details.results.version)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: docker-config
