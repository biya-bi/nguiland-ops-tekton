apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: helm-chart-oci-publish
  namespace: cicd
spec:
  params:
    - name: pipeline-run-name
    - name: namespace
    - name: repository
    - name: charts-dir
      default: charts
    - name: registry
      default: oci://artifactory-jcr.${ENVIRONMENT}.svc.cluster.local:8082/docker-local
    - name: excluded-charts
      default: "artifactory-jcr chart-repository"
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: $(tt.params.pipeline-run-name)
        namespace: cicd
      spec:
        pipelineRef:
          name: helm-chart-oci-publish
        taskRunTemplate:
          podTemplate:
            securityContext:
              fsGroup: 65532
          serviceAccountName: tekton-pipeline
        workspaces:
          - name: helm-source
            volumeClaimTemplate:
              metadata:
                labels:
                  tekton.dev/pvc-protection-finalizer: remove
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 100Mi
          - name: manifest-dir
            volumeClaimTemplate:
              metadata:
                labels:
                  tekton.dev/pvc-protection-finalizer: remove
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Mi
          - name: docker-config
            secret:
              secretName: docker-config
          - name: ssh-directory
            secret:
              secretName: ssh-credentials
        params:
          - name: namespace
            value: $(tt.params.namespace)
          - name: repository
            value: $(tt.params.repository)
          - name: charts-dir
            value: $(tt.params.charts-dir)
          - name: registry
            value: $(tt.params.registry)
          - name: excluded-charts
            value: $(tt.params.excluded-charts)
