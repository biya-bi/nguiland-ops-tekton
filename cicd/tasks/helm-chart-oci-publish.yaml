apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: helm-chart-oci-publish
  namespace: ${ENVIRONMENT}
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.17.0"
    tekton.dev/categories: Build
    tekton.dev/tags: helm,oci
    tekton.dev/displayName: "Helm chart OCI publish"
spec:
  description: >-
    Package Helm chart directories and push them to an OCI registry using
    Docker credentials mounted via the docker-config workspace.
  params:
    - name: charts-dir
      default: charts
    - name: registry
      default: oci://artifactory-jcr.${ENVIRONMENT}.svc.cluster.local:8082/docker-local
    - name: skip-tls
      type: string
      default: "false"
      description: "Whether to skip TLS verification and use plain HTTP for the OCI registry."
    - name: excluded-charts
      type: string
      default: ""
      description: >-
        Space-separated list of chart names to exclude (based on 'name' field in Chart.yaml).
  workspaces:
    - name: source
    - name: docker-config
      optional: true
  steps:
    - name: prepare-docker-config
      image: docker.io/library/bash:5.1.4@sha256:c523c636b722339f41b6a431b44588ab2f762c5de5ec3bd7964420ff982fb1d9
      script: |
        set -euo pipefail

        mkdir -p /tekton/home/.docker

        if [ -d "$(workspaces.docker-config.path)" ]; then
          cp -RL "$(workspaces.docker-config.path)/." /tekton/home/.docker/ || true
        fi

        # K8s secrets of type dockerconfigjson provide a .dockerconfigjson file.
        # Helm/Docker expect config.json.
        if [ -f /tekton/home/.docker/.dockerconfigjson ] && [ ! -f /tekton/home/.docker/config.json ]; then
          mv /tekton/home/.docker/.dockerconfigjson /tekton/home/.docker/config.json
        fi

        chmod 700 /tekton/home/.docker
        if [ -f /tekton/home/.docker/config.json ]; then
          echo "✅ Docker configuration successfully loaded into /tekton/home/.docker/config.json"
        fi
    - name: publish-helm-charts
      image: alpine/helm:3.20.2
      env:
        - name: HOME
          value: /tekton/home
        - name: DOCKER_CONFIG
          value: /tekton/home/.docker
      workingDir: $(workspaces.source.path)
      script: |
        set -euo pipefail

        push_opts=""
        if [ "$(params.skip-tls)" = "true" ]; then
          push_opts="--plain-http"
        fi

        raw_charts_dir="$(workspaces.source.path)/$(params.charts-dir)"
        if [ ! -d "${raw_charts_dir}" ]; then
          echo "Charts directory does not exist: ${raw_charts_dir}"
          exit 1
        fi
        charts_dir="$(cd "${raw_charts_dir}" && pwd)"

        # Track pushes via file to handle subshell scoping in 'while read'
        echo 0 > /tmp/pushed_count
        excluded_charts=" $(params.excluded-charts) "

        echo "🔍 Searching for Helm charts in ${charts_dir}..."

        # Find all Chart.yaml files recursively. Does not follow symbolic links by default.
        find "${charts_dir}" -name "Chart.yaml" > /tmp/found_charts

        while read -r chart_yaml; do
          chart_dir="$(cd "$(dirname "${chart_yaml}")" && pwd)"

          # 1. Skip if the directory itself is a symbolic link to avoid loops
          if [ -L "${chart_dir}" ]; then
            echo "⏭️  Skipping symbolic link: ${chart_dir}"
            continue
          fi

          name=$(grep -m1 '^name:' "${chart_yaml}" | sed 's/^name:[[:space:]]*//' | tr -d '\r')
          version=$(grep -m1 '^version:' "${chart_yaml}" | sed 's/^version:[[:space:]]*//' | tr -d '\r')

          if [ -z "${name}" ] || [ -z "${version}" ]; then
            echo "⚠️  Skipping invalid Chart.yaml at ${chart_yaml}"
            continue
          fi

          # 2. Check against the excluded charts
          case " ${excluded_charts} " in
            *" ${name} "*)
              echo "⏭️  Excluding chart per excluded-charts parameter: ${name}"
              continue
              ;;
          esac

          echo "Changing to directory ${chart_dir}"
          cd "${chart_dir}"

          # Handle JSON schema relative paths for linting
          schema_modified="false"
          if [ -f "values.schema.json" ]; then
            echo "🔧 Converting relative file:// paths in values.schema.json to absolute..."
            cp values.schema.json values.schema.json.bak
            sed -i "s|file://\([^/]\)|file://${chart_dir}/\1|g" values.schema.json
            schema_modified="true"
          fi

          echo "🚀 Publishing ${name}:${version}"

          echo "▶ Building dependencies..."
          helm dependency build .

          echo "▶ Linting and validating chart schema..."
          helm lint .

          if [ "${schema_modified}" = "true" ]; then
            echo "🗑️  Removing modified values.schema.json before packaging"
            rm values.schema.json
          fi

          echo "▶ Packaging chart..."
          helm package . --destination .

          if [ "${schema_modified}" = "true" ]; then
            echo "🔄 Restoring original values.schema.json..."
            mv values.schema.json.bak values.schema.json
          fi

          echo "▶ Pushing package to OCI registry..."
          helm push "${name}-${version}.tgz" "$(params.registry)" ${push_opts}

          rm "${name}-${version}.tgz"

          echo $(( $(cat /tmp/pushed_count) + 1 )) > /tmp/pushed_count
        done < /tmp/found_charts

        pushed=$(cat /tmp/pushed_count)
        if [ "${pushed}" -eq 0 ]; then
          echo "❌ No legitimate chart directories found to publish."
        fi
