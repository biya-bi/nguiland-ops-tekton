apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-flux-parsing
  namespace: ${ENVIRONMENT}
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.17.0"
    tekton.dev/categories: Kubernetes
    tekton.dev/tags: CLI, kubectl
    tekton.dev/displayName: "Git Flux Parsing"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    This task either returns the passed in Git repository URL and revision or
    retrieves them from the specified manifest file in the specified workspace.

  params:
    - name: url
      default: ""
    - name: revision
      default: ""
    - name: manifest-file
      default: ""
    - name: image
      default: docker.io/mikefarah/yq:4.44.2
  workspaces:
    - name: manifest-dir
  results:
    - name: url
    - name: revision
  steps:
    - name: parse
      image: $(params.image)
      workingDir: $(workspaces.manifest-dir.path)
      script: |
        set -euo pipefail

        url=$(echo $(params.url) | xargs)
        revision=$(echo $(params.revision) | xargs)
        manifest_file=$(params.manifest-file)

        green_color='\033[0;32m'
        red_color='\033[0;31m'
        default_color='\033[0m'

        if [ -z "$url" ]; then
          printf "The supplied URL is blank\n"
          printf "Ignoring the %s supplied revision\n" "$revision"

          printf "Checking the %s supplied manifest file\n" "$manifest_file"

          if [ ! -f "$manifest_file" ]; then
            printf "%bThe %s manifest file does not exist!%b\n" "$red_color" "$manifest_file" "$default_color"
            exit 1
          fi

          printf "The supplied %s manifest file was found\n" "$manifest_file"

          if [ ! -s "$manifest_file" ]; then
            printf "%bThe supplied %s manifest file is empty%b\n" "$red_color" "$manifest_file" "$default_color"
            exit 1
          fi

          printf "Extracting the URL from %s\n" "$manifest_file"

          manifest_content=$(cat "$manifest_file")

          url=$(echo "$manifest_content" | yq -r '.spec.url')

          if [ -z "$revision" ]; then
            revision=$(echo "$manifest_content" | yq -r '.spec.ref.branch')
            printf "No revision was supplied; using manifest branch %s\n" "$revision"
          else
            printf "Using the supplied revision %s\n" "$revision"
          fi

          printf "\nThe extracted URL is %b%s%b\n" "$green_color" "$url" "$default_color"
          printf "The resolved revision is %b%s%b\n" "$green_color" "$revision" "$default_color"
        else
          printf "The supplied URL is %b%s%b\n" "$green_color" "$url" "$default_color"
          printf "The supplied revision is %b%s%b\n" "$green_color" "$revision" "$default_color"
          if [ -n "$manifest_file" ]; then
            printf "Ignoring the %s manifest file\n" "$manifest_file"
          fi
        fi

        printf "%s" "$url" > $(results.url.path)
        printf "%s" "$revision" > $(results.revision.path)
