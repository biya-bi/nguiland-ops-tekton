apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: wait-for-deployment-ready
  namespace: ${ENVIRONMENT}
  labels:
    app.kubernetes.io/name: wait-for-deployment-ready
    app.kubernetes.io/part-of: tekton
spec:
  description: "Wait for a deployment matching a label selector to become available."
  params:
    - name: namespace
      type: string
      description: "Kubernetes namespace of the deployment to wait for"
    - name: selector
      type: string
      description: "Label selector to identify the deployment(s) to wait for"
    - name: timeout
      type: string
      default: "10m"
      description: "Timeout for waiting for the deployment availability condition"
    - name: kubectl-image
      default: gcr.io/cloud-builders/kubectl@sha256:8ab94be8b2b4f3d117f02d868b39540fddd225447abf4014f7ba4765cb39f753
  workspaces:
    - name: kubeconfig-dir
      optional: true
  steps:
    - name: wait
      image: $(params.kubectl-image)
      script: |
        #!/bin/bash
        set -euo pipefail

        if [[ "$(workspaces.kubeconfig-dir.bound)" == "true" ]] && \
           [[ -f $(workspaces.kubeconfig-dir.path)/kubeconfig ]]; then
          export KUBECONFIG=$(workspaces.kubeconfig-dir.path)/kubeconfig
        fi

        echo "Waiting for deployment(s) with selector: $(params.selector) in namespace: $(params.namespace)"
        kubectl wait --for=condition=available deployment -l "$(params.selector)" -n "$(params.namespace)" --timeout="$(params.timeout)"
