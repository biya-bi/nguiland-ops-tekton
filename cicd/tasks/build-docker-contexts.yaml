apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-docker-contexts
  namespace: infra
spec:
  description: |
    Detects changed directories and builds/pushes them using Kaniko.
  workspaces:
    - name: source
      description: A directory containing the cloned Git repository.
    - name: docker-config
      description: Includes the config.json for registry authentication.
      mountPath: /kaniko/.docker
  params:
    - name: registry
      type: string
      description: The container registry to which each image will be published.
    - name: repository
      type: string
      description: The repository within the registry to which each image will be published.
    - name: path
      type: string
      description: The path within the repository to which each image will be published.
    - name: changed-dirs
      type: string
      description: The list of changed directories to process, or a dot if all should be processed.
    - name: always-build
      type: string
      default: "false"
      description: If true, builds all valid subdirectories.
    - name: skip-tls
      type: string
      default: "false"
      description: "Whether to skip TLS verification and use plain HTTP for the registry."
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:debug
      workingDir: $(workspaces.source.path)
      script: |
        #!/busybox/sh
        set -eu
        BASE="$(workspaces.source.path)"

        CHANGED_DIRS="$(params.changed-dirs)"
        ALWAYS_BUILD="$(params.always-build)"

        # 1. Exit only if there are no changes AND always-build is false
        if [ "$CHANGED_DIRS" = "." ] && [ "$ALWAYS_BUILD" != "true" ]; then
          echo "✅ No changes to process. Exiting."
          exit 0
        fi

        # 2. Define which directories to iterate over
        if [ "$ALWAYS_BUILD" = "true" ]; then
          echo "🔍 'always-build' is enabled. Finding all valid contexts..."
          DIRS=$(ls -d */ 2>/dev/null | sed 's#/##')

          # Show warning if no subdirectories are found
          if [ -z "$DIRS" ]; then
            echo "⚠️ Warning: 'always-build' is true, but no subdirectories were found in $(pwd)"
          fi
        else
          # Use the list passed from the detection task
          DIRS="$CHANGED_DIRS"
        fi

        is_valid() {
          [ -d "$BASE/$1" ] && [ -f "$BASE/$1/Dockerfile" ] && [ -f "$BASE/$1/VERSION" ]
        }

        for DIR in $DIRS; do
          if is_valid "$DIR"; then
            echo "🚀 Processing directory: $DIR"
            VERSION=$(cat "$BASE/$DIR/VERSION" | tr -d '[:space:]' | sed 's/+/-/g')
            IMAGE_PATH="$(params.registry)/$(params.repository)/$(params.path)/$DIR"

            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

            extra_args=""
            if [ "$(params.skip-tls)" = "true" ]; then
              extra_args="--insecure --skip-tls-verify"
            fi

            /kaniko/executor \
              --context "$BASE/$DIR" \
              --dockerfile "$BASE/$DIR/Dockerfile" \
              --destination "$IMAGE_PATH:$VERSION" \
              --destination "$IMAGE_PATH:latest" \
              --build-arg="BUILD_DATE=$BUILD_DATE" \
              --build-arg="VERSION=$VERSION" \
              ${extra_args}
          else
            # Only show skip message if we were expecting a specific directory to work
            if [ "$ALWAYS_BUILD" != "true" ]; then
              echo "⏭️ Skipping $DIR (Missing Dockerfile or VERSION)"
            fi
          fi
        done
