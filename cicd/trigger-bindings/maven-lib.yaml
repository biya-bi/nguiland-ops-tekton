apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: maven-lib
  namespace: cicd
spec: 
  params:
  - name: pipeline-run-name
    value: $(header.X-Tekton-PipelineRun-Name)
  - name: namespace
    value: $(body.involvedObject.namespace)
  - name: repository
    value: $(body.involvedObject.name)
  - name: context-dir
    value: $(body.metadata.contextDir)
  - name: revision
    value: $(body.metadata.revision)