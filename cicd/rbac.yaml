apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-robot
  namespace: ${ENVIRONMENT}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-robot
  namespace: ${ENVIRONMENT}
subjects:
- kind: ServiceAccount
  name: tekton-robot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-robot
subjects:
- kind: ServiceAccount
  name: tekton-robot
  namespace: ${ENVIRONMENT}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
